version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_coach_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env  # optional, create if you need secrets
    # No volumes needed now – code baked into the image

  frontend:
    image: nginx:stable-alpine
    container_name: ai_coach_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
